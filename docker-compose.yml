services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: enzerlin/flight-airflow:3.3.2
    container_name: flight-airflow
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Taipei
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: flight_price
      TZ: Asia/Taipei
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./airflow_config/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    command: standalone

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: flight-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flight_price}
      TZ: Asia/Taipei
    ports:
      - "127.0.0.1:8501:8501"
